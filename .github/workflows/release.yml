name: Release

# A new version number on main (see `npm run release`) builds the Windows
# installers on GitHub's machines and publishes them as a GitHub release.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already published."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The notes of this version in CHANGELOG.md: shown on the release page
      # and by Clipper when it offers the update.
      - name: Release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          awk -v head="## ${TAG#v}" '$0 == head { found = 1; next } /^## / { if (found) exit } found' CHANGELOG.md > notes.md
          {
            echo 'body<<CLIPPER_NOTES_END'
            cat notes.md
            echo
            echo '---'
            echo "Téléchargez **Clipper_*_x64-setup.exe** (recommandé : installation sans droits administrateur) ou le fichier **.msi**. Les versions installées se mettent à jour depuis Paramètres › À propos."
            echo "Empreintes SHA-256 : \`SHA256SUMS.txt\`."
            echo 'CLIPPER_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      # Signs the installers for the updater and publishes latest.json.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Clipper ${{ needs.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Publish SHA-256 checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          gh release upload "${{ needs.version.outputs.tag }}" SHA256SUMS.txt --clobber

      - name: Keep installers as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: clipper-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
