[package]
name = "clipper"
version = "3.4.0"
description = "Clipper - gestionnaire de presse-papiers pour Windows"
authors = ["titilyonnais"]
license = "MIT"
repository = "https://github.com/titilyonnais/Clipper"
edition = "2021"
rust-version = "1.85"

[lib]
name = "clipper_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# native-tls = SChannel on Windows: no bundled crypto library, smaller binary.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
sha2 = "0.11"
anyhow = "1"
parking_lot = "0.12"
log = { version = "0.4", features = ["std"] }
base64 = "0.23"
crc32fast = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }

clipboard-win = { version = "5", features = ["monitor"] }
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# WinRT, for the OCR engine built into Windows.
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
] }

[profile.dev]
# Faster incremental builds: no debug info for dependencies.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
